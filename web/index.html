<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="coffee_masters">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Coffee Masters</title>
  <link rel="manifest" href="manifest.json">

  <script>
    // The value below is injected by flutter build, do not touch.
    const serviceWorkerVersion = "{{flutter_service_worker_version}}";
  </script>

  <!-- SQLite initialization -->
  <script>
    // Initialize SQLite WASM
    window.sqlite3InitModule = async function() {
      const sqlite3 = await import('./sqlite3/sqlite3.js');
      return sqlite3;
    };
  </script>

  <!-- This script adds the flutter initialization JS code -->
  <script src="flutter.js" defer></script>
</head>
<body>
  <div id="loading">Loading...</div>
  <script>
    window.addEventListener('load', function() {
      var loading = document.querySelector('#loading');
      
      // Add Flutter build configuration
      window._flutter = {
        loader: {
          load: function(options) {
            return new Promise(function(resolve, reject) {
              var script = document.createElement('script');
              script.src = 'main.dart.js';
              script.type = 'application/javascript';
              script.onload = function() {
                resolve(options.onEntrypointLoaded);
              };
              script.onerror = reject;
              document.body.appendChild(script);
            });
          }
        }
      };

      _flutter.loader.load({
        onEntrypointLoaded: async function(engineInitializer) {
          loading.textContent = 'Initializing app...';
          let appRunner = await engineInitializer.initializeEngine();
          loading.textContent = 'Running app...';
          await appRunner.runApp();
          loading.remove();
        }
      });
    });
  </script>
</body>
</html>
